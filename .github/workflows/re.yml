name: Compile luci-app-netstat RE

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Platform/Architecture'
        required: true
        default: 'qualcommax/ipq807x'
      firmware_version:
        description: 'Firmware Version'
        required: true
        default: '24.10.0'
      custom_name:
        description: 'File Name (without .ipk)'
        required: false
        
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Required to create tags

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
        gettext git java-propose-classpath libelf-dev libncurses5-dev \
        libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
        unzip wget rsync subversion swig time xsltproc zlib1g-dev tree zstd

    - name: Set Python symlink
      run: sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Set target variable
      id: set_target
      run: |
        echo "TARGET_DASH=$(echo ${{ github.event.inputs.target }} | sed 's|/|-|g')" >> $GITHUB_OUTPUT

    - name: Download and extract OpenWrt SDK
      run: |
        SDK_BASE_URL="https://downloads.openwrt.org/releases/${{ github.event.inputs.firmware_version }}/targets/${{ github.event.inputs.target }}/"
        SDK_FILE=$(curl -s "$SDK_BASE_URL" | grep -oP 'openwrt-sdk-.*?-${{ steps.set_target.outputs.TARGET_DASH }}_gcc-.*?Linux-x86_64\.tar\.(xz|zst)' | head -n 1)
        if [ -z "$SDK_FILE" ]; then
          echo "Unable to find matching SDK file"
          exit 1
        fi
        SDK_URL="${SDK_BASE_URL}${SDK_FILE}"
        echo "Downloading SDK: $SDK_URL"
        wget "$SDK_URL" -O openwrt.tar.${SDK_FILE##*.}
        mkdir openwrt
        if [[ "$SDK_FILE" == *.zst ]]; then
          tar --use-compress-program=unzstd -xvf openwrt.tar.zst -C openwrt --strip-components=1
        else
          tar -xJf openwrt.tar.xz -C openwrt --strip-components=1
        fi

    - name: Copy plugin source from local directory
      run: |
        PLUGIN_NAME=luci-app-netstat
        PLUGIN_VERSION=$(cd $PLUGIN_NAME && git describe --tags --abbrev=0 2>/dev/null || echo latest)
        echo "PLUGIN_NAME=$PLUGIN_NAME" >> $GITHUB_ENV
        echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_ENV
        mkdir -p openwrt/package/$PLUGIN_NAME
        cp -r $PLUGIN_NAME/* openwrt/package/$PLUGIN_NAME/

    - name: Configure OpenWrt
      working-directory: openwrt
      run: |
        echo "CONFIG_PACKAGE_${{ env.PLUGIN_NAME }}=m" >> .config
        make defconfig

    - name: Compile plugin
      working-directory: openwrt
      run: make package/${{ env.PLUGIN_NAME }}/compile V=s

    - name: Organize files
      run: |
        mkdir -p firmware
        find openwrt/bin/packages/ -type f -name "${{ env.PLUGIN_NAME }}*.ipk" -exec cp {} firmware/ \;
        cd firmware
        DATE_TAG=$(date +'%Y%m%d')
        if compgen -G "*.ipk" > /dev/null; then
          for file in *.ipk; do
            if [ -n "${{ github.event.inputs.custom_name }}" ]; then
              mv "$file" "${{ github.event.inputs.custom_name }}.ipk"
              echo "FINAL_NAME=${{ github.event.inputs.custom_name }}" >> $GITHUB_ENV
            else
              FINAL_NAME="${{ steps.set_target.outputs.TARGET_DASH }}-${{ github.event.inputs.firmware_version }}-${{ env.PLUGIN_NAME }}-${DATE_TAG}"
              mv "$file" "$FINAL_NAME.ipk"
              echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV
            fi
          done
        else
          echo "No IPK files found to rename!"
          exit 1
        fi
        ls -l

    - name: Create git tag by date
      run: |
        TAG_NAME="netstat-$(date +'%Y%m%d')"
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag -a "$TAG_NAME" -m "Auto tag by GitHub Actions on $(date)"
        git push origin "$TAG_NAME"

    - name: Upload to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FINAL_NAME }}
        path: firmware/*.ipk

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: netstat-$(date +'%Y%m%d')
        name: Compile luci-app-netstat
        files: firmware/*.ipk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
